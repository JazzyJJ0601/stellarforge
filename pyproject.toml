[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "stellarforge"
version = "0.1.0"
description = "An N-body gravitational simulation engine using the Barnes-Hut algorithm"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "numpy"]
